<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FM Radio</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>

#tabs {
  display: flex;
  justify-content: space-around;
  padding: 0 24px;
  margin-top: 24px;
  gap: 35px;
}

.tab {
  cursor: pointer;
  font-weight: 400;
  font-size: 10px;
  color: #666;
  padding-bottom: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  position: relative;
  transition: all 0.3s ease;
  border-bottom: none !important;
}

.tab-button {
  width: 45px;
  height: 45px;
  border-radius: 90%;
  border: none;
  box-shadow: none;
  transition: all 0.3s ease;
  position: relative;
}

.tab.active {
  border-bottom: none;
}

.tab-label {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.5px;
  order: -1;
  transition: color 0.3s ease;
}

.tab.active .tab-label {
  font-weight: 500;
}

.tab-button.sbs {
  background: #e89a3c;
}

.tab-button.mbc {
  background: #e66841;
}

.tab-button.kbs {
  background: #a94442;
}

.tab-button.etc {
  background: #8b9456;
}

.tab.active .tab-button.sbs ~ .tab-label {
  color: #e89a3c;
}

.tab.active .tab-button.mbc ~ .tab-label {
  color: #e66841;
}

.tab.active .tab-button.kbs ~ .tab-label {
  color: #a94442;
}

.tab.active .tab-button.etc ~ .tab-label {
  color: #8b9456;
}

body {
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
}

* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

#dial {
  --dial-height: 180px;
  height: var(--dial-height);
  position: relative;
}

.scale {
  position: absolute;
  bottom: 15px;
  left: 0;
  right: 0;
  height: 80px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 30px;
}

.tick {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.tick.major .tick-mark {
  width: 1.6px;
  height: 24px;
  background: #00d9ff;
  margin-bottom: 6px;
  box-shadow: 0 0 4px #00d9ff;
}

.tick.major .tick-label {
  font-size: 11px;
  font-weight: 500;
  color: #00d9ff;
  text-shadow: 0 0 6px rgba(0,217,255,0.6);
}

.tick.medium .tick-mark {
  width: 1.5px;
  height: 27px;
  background: #00b8dd;
  margin-bottom: 6px;
}

.tick.minor .tick-mark {
  width: 1px;
  height: 20px;
  background: #008ba8;
  margin-bottom: 6px;
  opacity: 0.7;
}

.am-scale {
  position: absolute;
  top: 15px;
  left: 0;
  right: 0;
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 0 30px;
  opacity: 0.5;
}

.am-tick {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.am-tick-label {
  font-size: 9px;
  color: #00d9ff;
  margin-bottom: 4px;
  text-shadow: 0 0 4px rgba(0,217,255,0.4);
}

.am-tick-mark {
  width: 1px;
  height: 10px;
  background: #00d9ff;
}

.am-tick.major .am-tick-mark {
  height: 14px;
  width: 1.5px;
}

#needle {
  position: absolute;
  top: -12px;
  width: 3px;
  height: calc(var(--dial-height) + 24px);
  background: linear-gradient(to bottom, #ff3333, #cc0000);
  box-shadow: 0 0 12px rgba(255,51,51,0.9);
  z-index: 10;
  transition: left .06s ease-out;
}

#dialInfo {
  padding: 10px 12px 0;
}

#freqText {
  font-size: 32px;
  font-weight: 600;
}

#stationText {
  font-size: 13px;
  color: #9ca3af;
  margin-top: 4px;
}

#nowProgram {
  font-size: 12px;
  color: #d1d5db;
  margin-top: 2px;
  min-height: 18px;
  line-height: 18px;
}

#stereoLamp {
  margin-bottom: 10px;
}

.stereo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #0f0;
  box-shadow: 0 0 10px #0f0;
  opacity: 0;
  transition: .3s;
}

.stereo.on {
  opacity: 1;
}

.power-on {
  background: #154efa !important;
  box-shadow: 0 0 12px #154efa;
}

#channelList {
  overflow: hidden;
  height: 0;
  opacity: 0;
  transform: translateY(-6px);
  transition: height .45s, opacity .3s, transform .45s;
}

#channelList.open {
  opacity: 1;
  transform: translateY(0);
}

.channel-item {
  opacity: 0;
  transform: translateY(6px);
  transition: .35s;
}

#channelList.open .channel-item {
  opacity: 1;
  transform: translateY(0);
}

#freqRange {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

@media (orientation: landscape) {
  body {
    max-width: none;
    width: 100vw;
    height: 100vh;
    padding: 0;
  }

  #layoutRoot {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    height: 100%;
    width: 100%;
  }

  header {
    width: 28%;
    max-width: 320px;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
  }

  header > div:first-child {
    display: flex;
    flex-direction: column;
  }

  header > div:first-child > div:first-child {
    font-size: 18px;
    font-weight: 600;
  }

  #currentTime {
    font-size: 11px;
    margin-top: 4px;
  }

  #powerBtn {
    align-self: flex-end;
    margin-top: auto;
  }

  #topArea {
    flex: 1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow-y: auto;
  }

  #dial {
    --dial-height: 160px;
    height: var(--dial-height);
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  .scale {
    height: 75px;
    padding: 0 20px;
  }

  #dialInfo {
    padding: 8px 12px 0;
    flex-shrink: 0;
  }

  #freqText {
    font-size: 28px;
  }

  #stationText {
    font-size: 12px;
  }

  #nowProgram {
    font-size: 11px;
  }

  #tabs {
    position: fixed;
    bottom: 12px;
    left: 16px;
    right: 16px;
    margin-top: 0;
    padding: 0;
    gap: 20px;
    justify-content: center;
    z-index: 20;
  }

  .tab {
    gap: 8px;
  }

  .tab-label {
    font-size: 10px;
    order: 1;
  }

  #channelList {
    margin-top: 8px;
    max-height: 180px;
    z-index: 15;
  }

  #channelList.open {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px 0;
  }

  .channel-item {
    font-size: 12px;
    padding: 6px 8px !important;
    margin-bottom: 0 !important;
  }
}

</style>
</head>

<body class="bg-neutral-900 text-white max-w-md mx-auto">

<div id="layoutRoot">
  <header class="flex justify-between items-center px-4 py-3 text-lg font-semibold">
    <div>
      <div>FM Radio</div>
      <div id="currentTime" class="text-xs font-normal text-gray-400 mt-0.5"></div>
    </div>
    <button id="powerBtn" class="w-9 h-9 rounded-full bg-neutral-700"></button>
  </header>

  <div id="topArea" class="px-4">
    <div id="dial" class="relative rounded-xl overflow-hidden bg-gradient-to-b from-neutral-800 to-neutral-900">
      <div id="scale" class="scale"></div>
      <div id="needle"></div>
      <input id="freqRange" type="range" min="87.5" max="108" step="0.1" class="absolute inset-0 opacity-0 z-20">
    </div>

      <div class="flex items-center justify-between">
        <div id="freqText"></div>
        <div id="stereoLamp" class="stereo"></div>

    <div id="channelList" class="px-4 py-4"></div>
  </div>
</div>

<div id="tabs" class="flex justify-around px-6 mt-6"></div>

<script>

let scanAudios = [];
let scanInterval = null;
let lastTunedFreq = null;
let originalVolume = 1;
let isDirectTuning = false;
let isScanningActive = false;
let audioContext = null;

function startScan(currentFreq) {
  if (isDirectTuning || isChanging) {
    return;
  }
  
  isScanningActive = true;
  
  if (lastTunedFreq && Math.abs(currentFreq - lastTunedFreq) >= 2 && !audio.paused) {
    const fadeOutInterval = setInterval(() => {
      if (audio.volume > 0.05) {
        audio.volume = Math.max(0, audio.volume - 0.15);
      } else {
        audio.pause();
        audio.volume = originalVolume;
        clearInterval(fadeOutInterval);
      }
    }, 30);
  }
  
  stopScan();
  
  const flat = channels.flatMap(g => g.list);
  const nearbyStations = flat.filter(ch => 
    Math.abs(ch.freq - currentFreq) <= 2
  );
  
  const isIOSDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  if (isIOSDevice) {
    const nearestStation = nearbyStations.reduce((a, b) => 
      Math.abs(b.freq - currentFreq) < Math.abs(a.freq - currentFreq) ? b : a
    , {freq: 0});
    
    const distanceToNearest = Math.abs(nearestStation.freq - currentFreq);
    
    if (distanceToNearest <= 1.5 && nearestStation.url) {
      const tempAudio = new Audio(nearestStation.url);
      const volume = Math.max(0, 1 - (distanceToNearest / 1.5));
      tempAudio.volume = volume * 0.25;
      tempAudio.play().catch(() => {});
      scanAudios.push(tempAudio);
    }
    
    noiseGain.gain.value = Math.min(0.3, distanceToNearest * 0.12);
    
  } else {
    nearbyStations.forEach(station => {
      const distance = Math.abs(station.freq - currentFreq);
      const volume = Math.max(0, 1 - (distance / 2));
      
      if (volume > 0.1) {
        const tempAudio = new Audio(station.url);
        tempAudio.volume = volume * 0.4;
        tempAudio.play().catch(() => {});
        scanAudios.push(tempAudio);
      }
    });
    
    const nearestStation = nearbyStations.reduce((a, b) => 
      Math.abs(b.freq - currentFreq) < Math.abs(a.freq - currentFreq) ? b : a
    , {freq: 0});
    
    const distanceToNearest = Math.abs(nearestStation.freq - currentFreq);
    noiseGain.gain.value = Math.min(0.2, distanceToNearest * 0.08);
  }
}

function stopScan() {
  scanAudios.forEach((audio, index) => {
    try {
      audio.pause();
      audio.currentTime = 0;
      audio.src = '';
      audio.load();
    } catch (e) {
      console.log(`임시 오디오 ${index} 정리 오류:`, e);
    }
  });
  scanAudios = [];
  isScanningActive = false;
  noiseGain.gain.value = 0;
}

const MIN = 87.5, MAX = 108;
const audio = new Audio();
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const noiseGain = ctx.createGain();
noiseGain.gain.value = 0;

let power = false;
let activeGroup = null;
let currentSchedule = null;
let inputTimer = null;
let isChanging = false;
let lastTouchX = null;
let isTouching = false;
let lastTouchEnd = 0;

let fadeTimer = null;

function clearFade() {
  if (fadeTimer) {
    clearInterval(fadeTimer);
    fadeTimer = null;
  }
}

function setVolumeInstant(volume) {
  clearFade();
  audio.volume = Math.max(0, Math.min(1, volume));
}

function fadeToVolume(targetVolume = originalVolume, duration = 800) {
  clearFade();
  targetVolume = Math.max(0, Math.min(1, targetVolume));

  const startVolume = audio.volume;
  const diff = targetVolume - startVolume;
  if (diff === 0) return;

  const steps = 20;
  const stepTime = duration / steps;
  let currentStep = 0;

  fadeTimer = setInterval(() => {
    currentStep++;
    const ratio = currentStep / steps;
    const v = startVolume + diff * ratio;
    audio.volume = Math.max(0, Math.min(1, v));

    if (currentStep >= steps || audio.paused) {
      audio.volume = targetVolume;
      clearFade();
    }
  }, stepTime);
}

function fadeIn(targetVolume = originalVolume, duration = 800) {
  setVolumeInstant(0);
  fadeToVolume(targetVolume, duration);
}

function fadeOut(duration = 500) {
  fadeToVolume(0, duration);
}

const range = document.getElementById('freqRange');
const needle = document.getElementById('needle');
const freqText = document.getElementById('freqText');
const stationText = document.getElementById('stationText');
const nowProgram = document.getElementById('nowProgram');
const stereo = document.getElementById('stereoLamp');
const powerBtn = document.getElementById('powerBtn');
const tabs = document.getElementById('tabs');
const channelList = document.getElementById('channelList');
const scale = document.getElementById('scale');

const channels = [
  {
    group: 'S B S',
    list: [
      {name: 'SBS 파워FM', freq: 107.7, url: 'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm', json: 'schedule/sbs-powerfm.json'},
      {name: 'SBS 러브FM', freq: 103.5, url: 'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm', json: 'schedule/sbs-lovefm.json'},
      {name: 'SBS 고릴라디오M', freq: 88.5, url: 'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb', json: 'schedule/sbs-gorillam.json'}
    ]
  },
  {
    group: 'M B C',
    list: [
      {name: 'MBC FM4U', freq: 91.9, url: 'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u', json: 'schedule/mbc-fm4u.json'},
      {name: 'MBC 표준FM', freq: 95.9, url: 'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm', json: 'schedule/mbc-standardfm.json'},
      {name: 'MBC 올댓뮤직', freq: 100.7, url: 'https://radio.bsod.kr/stream/?stn=mbc&ch=chm', json: 'schedule/mbc-allthatmusic.json'}
    ]
  },
  {
    group: 'K B S',
    list: [
      {name: 'KBS 1라디오', freq: 97.3, url: 'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio', json: 'schedule/kbs-1radio.json'},
      {name: 'KBS 2라디오', freq: 106.1, url: 'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio', json: 'schedule/kbs-happyfm.json'},
      {name: 'KBS 3라디오', freq: 104.9, url: 'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio', json: 'schedule/kbs-3radio.json'},
      {name: 'KBS 1FM', freq: 93.1, url: 'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm', json: 'schedule/kbs-classicfm.json'},
      {name: 'KBS 2FM', freq: 89.1, url: 'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm', json: 'schedule/kbs-coolfm.json'}
    ]
  },
  {
    group: 'E T C',
    list: [
      {name: 'EBS FM', freq: 104.5, url: 'https://radio.bsod.kr/stream/?stn=ebs'},
      {name: 'TBS FM', freq: 95.1, url: 'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
      {name: 'TBS eFM', freq: 101.3, url: 'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
      {name: 'CBS 표준FM', freq: 98.1, url: 'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
      {name: 'CBS 음악FM', freq: 93.9, url: 'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
      {name: 'CBS JOY4U', freq: 90.1, url: 'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
    ]
  }
];

const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < data.length; i++) {
  data[i] = (Math.random() * 2 - 1) * 0.5;
}
const noise = ctx.createBufferSource();
noise.buffer = buffer;
noise.loop = true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

for (let freq = 88; freq <= 108; freq += 0.5) {
  const tick = document.createElement('div');
  
  if (freq % 4 === 0) {
    tick.className = 'tick major';
    tick.innerHTML = `
      <div class="tick-mark"></div>
      <div class="tick-label">${Math.round(freq)}</div>
    `;
  } else if (freq % 2 === 0) {
    tick.className = 'tick medium';
    tick.innerHTML = `<div class="tick-mark"></div>`;
  } else {
    tick.className = 'tick minor';
    tick.innerHTML = `<div class="tick-mark"></div>`;
  }
  
  scale.appendChild(tick);
}

const amScale = document.createElement('div');
amScale.className = 'am-scale';
[530, 630, 810, 1080, 1350, 1620].forEach(freq => {
  const tick = document.createElement('div');
  tick.className = 'am-tick major';
  tick.innerHTML = `
    <div class="am-tick-label">${freq}</div>
    <div class="am-tick-mark"></div>
  `;
  amScale.appendChild(tick);
});
document.getElementById('dial').insertBefore(amScale, scale);

async function loadSchedule(path) {
  try {
    const r = await fetch(path);
    currentSchedule = await r.json();
    updateNowProgram();
  } catch {
    currentSchedule = null;
    nowProgram.textContent = '';
  }
}

function dayKey() {
  const d = new Date().getDay();
  return d === 6 ? 'saturday' : d === 0 ? 'sunday' : 'weekday';
}

function toMin(t) {
  let [h, m] = t.split(":").map(Number);
  if (h < 5) h += 24;
  return h * 60 + m;
}

function updateNowProgram() {
  if (!currentSchedule) return;
  const now = new Date();
  let nowMin = now.getHours() * 60 + now.getMinutes();
  if (now.getHours() < 5) nowMin += 1440;
  const list = currentSchedule.schedule[dayKey()] || currentSchedule.schedule.weekday;
  
  for (let i = 0; i < list.length; i++) {
    const cur = toMin(list[i].time || list[i].start);
    const next = list[i + 1] ? toMin(list[i + 1].time || list[i + 1].start) : 9999;
    if (nowMin >= cur && nowMin < next) {
      nowProgram.textContent = list[i].title;
      
      if (power && !audio.paused) {
        const flat = channels.flatMap(g => g.list);
        const currentChannel = flat.find(ch => ch.url === audio.src);
        if (currentChannel) {
          updateMediaSession(currentChannel, list[i].title);
        }
      }
      return;
    }
  }
  nowProgram.textContent = '';
}

setInterval(updateNowProgram, 60000);

function updateNeedle(f) {
  const majorFreqs = [88, 92, 96, 100, 104, 108];
  const ticks = document.querySelectorAll('.tick.major');
  
  if (ticks.length === 0) {
    needle.style.left = ((f - MIN) / (MAX - MIN) * dial.clientWidth) + 'px';
    freqText.textContent = f.toFixed(1) + ' MHz';
    return;
  }
  
  let position;
  if (f <= majorFreqs[0]) {
    position = ticks[0].offsetLeft + (ticks[0].offsetWidth / 2);
  } else if (f >= majorFreqs[majorFreqs.length - 1]) {
    position = ticks[ticks.length - 1].offsetLeft + (ticks[ticks.length - 1].offsetWidth / 2);
  } else {
    for (let i = 0; i < majorFreqs.length - 1; i++) {
      if (f >= majorFreqs[i] && f <= majorFreqs[i + 1]) {
        const tick1 = ticks[i].offsetLeft + (ticks[i].offsetWidth / 2);
        const tick2 = ticks[i + 1].offsetLeft + (ticks[i + 1].offsetWidth / 2);
        const ratio = (f - majorFreqs[i]) / (majorFreqs[i + 1] - majorFreqs[i]);
        position = tick1 + (tick2 - tick1) * ratio;
        break;
      }
    }
  }
  
  needle.style.left = position + 'px';
  freqText.textContent = f.toFixed(1) + ' MHz';
}

function updateMediaSession(channel, programTitle) {
  if (!('mediaSession' in navigator)) return;

  const title = programTitle || channel.name;
  const artist = channel.group || 'FM Radio';

  navigator.mediaSession.metadata = new MediaMetadata({
    title: title,
    artist: artist,
    album: 'FM Radio',
    artwork: [
      {src: 'bg-radio.png', sizes: '512x512', type: 'image/png'}
    ]
  });
}

async function snapTo(freq) {
  isDirectTuning = true;
  stopScan();
  
  const isIOSDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  if (audio.src) {
    audio.pause();
    audio.currentTime = 0;
  }
  
  await new Promise(resolve => setTimeout(resolve, isIOSDevice ? 50 : 30));
  
  const flat = channels.flatMap(g => g.list);
  const nearest = flat.reduce((a, b) =>
    Math.abs(b.freq - freq) < Math.abs(a.freq - freq) ? b : a
  );

  range.value = nearest.freq;
  updateNeedle(nearest.freq);
  stationText.textContent = nearest.name;
  
  if (nearest.json) {
    loadSchedule(nearest.json);
  } else {
    currentSchedule = null;
    nowProgram.textContent = '';
  }
  
  if (!power) {
    stereo.classList.remove('on');
    isDirectTuning = false;
    noiseGain.gain.value = 0;
    return;
  }

  noiseGain.gain.value = 0;
  stereo.classList.remove('on');
  
  if (audio.src === nearest.url && !audio.paused && audio.readyState >= 2) {
    stationText.textContent = nearest.name;
    stereo.classList.add('on');
    lastTunedFreq = nearest.freq;
    isDirectTuning = false;
    return;
  }

  stationText.textContent = nearest.name + ' 연결 중...';
  
  try {
    audio.pause();
    audio.src = '';
    audio.currentTime = 0;
    
    await new Promise(resolve => setTimeout(resolve, isIOSDevice ? 80 : 50));
    
    audio.src = nearest.url;
    audio.volume = originalVolume;
    audio.load();
    
    const readyPromise = new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        reject(new Error('스트림 로드 타임아웃 (6초)'));
      }, 6000);
      
      const onCanPlay = () => {
        clearTimeout(timeout);
        audio.removeEventListener('canplay', onCanPlay);
        audio.removeEventListener('loadeddata', onLoadedData);
        audio.removeEventListener('error', onError);
        resolve();
      };
      
      const onLoadedData = () => {
        if (audio.readyState >= 2) {
          clearTimeout(timeout);
          audio.removeEventListener('canplay', onCanPlay);
          audio.removeEventListener('loadeddata', onLoadedData);
          audio.removeEventListener('error', onError);
          resolve();
        }
      };
      
      const onError = () => {
        clearTimeout(timeout);
        audio.removeEventListener('canplay', onCanPlay);
        audio.removeEventListener('loadeddata', onLoadedData);
        audio.removeEventListener('error', onError);
        reject(new Error('스트림 로드 에러'));
      };
      
      audio.addEventListener('canplay', onCanPlay);
      audio.addEventListener('loadeddata', onLoadedData);
      audio.addEventListener('error', onError);
      
      if (audio.readyState >= 2) {
        clearTimeout(timeout);
        audio.removeEventListener('canplay', onCanPlay);
        audio.removeEventListener('loadeddata', onLoadedData);
        audio.removeEventListener('error', onError);
        resolve();
      }
    });
    
    await readyPromise;
    
    let retryCount = 0;
    const maxRetries = 3;
    let playSuccess = false;
    
    while (retryCount < maxRetries && !playSuccess) {
      try {
        if (isIOSDevice && retryCount > 0) {
          audio.load();
          await new Promise(resolve => setTimeout(resolve, 150));
        }
        
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          await playPromise;
        }
        
        await new Promise(resolve => setTimeout(resolve, 100));
        
        if (!audio.paused && audio.readyState >= 2) {
          playSuccess = true;
          stationText.textContent = nearest.name;
          stereo.classList.add('on');
          lastTunedFreq = nearest.freq;
          break;
        } else {
          throw new Error('재생 상태 확인 실패');
        }
        
      } catch (err) {
        retryCount++;
        
        if (retryCount >= maxRetries) {
          throw err;
        }
        
        const waitTime = 100 * retryCount;
        await new Promise(resolve => setTimeout(resolve, waitTime));
      }
    }
    
    if (!playSuccess) {
      throw new Error('최대 재시도 횟수 초과');
    }
    
  } catch (e) {
    stereo.classList.remove("on");
    noiseGain.gain.value = 0;
    stationText.textContent = nearest.name + " - 재생 오류";
    
    setTimeout(async () => {
      if (power && (audio.paused || audio.readyState < 3)) {
        stationText.textContent = nearest.name + ' 재연결 중...';
        
        try {
          audio.pause();
          audio.src = '';
          audio.currentTime = 0;
          await new Promise(resolve => setTimeout(resolve, 150));
          
          audio.src = nearest.url;
          audio.volume = originalVolume;
          audio.load();
          
          await new Promise(resolve => setTimeout(resolve, 300));
          
          await audio.play();
          stationText.textContent = nearest.name;
          stereo.classList.add('on');
          
        } catch (retryErr) {
          stationText.textContent = nearest.name + " - 방송 불가";
        }
      }
    }, 3000);
    
  } finally {
    setTimeout(() => {
      isDirectTuning = false;
    }, 200);
  }
}

audio.addEventListener('playing', () => {
  if (!power) return;
  
  noiseGain.gain.value = 0;
  stereo.classList.add('on');

  const flat = channels.flatMap(g => g.list);
  const currentChannel = flat.find(ch => ch.url === audio.src);
  if (currentChannel) {
    stationText.textContent = currentChannel.name;
  }
});

audio.addEventListener('waiting', () => {
  stereo.classList.remove('on');
  
  if (power && !isScanningActive) {
    if (isDirectTuning || isChanging) {
      noiseGain.gain.value = 0;
    } else {
      noiseGain.gain.value = 0.05;
    }
  }
});

audio.addEventListener('pause', () => {
  stereo.classList.remove('on');
  
  if (power && !isScanningActive && !isDirectTuning) {
    noiseGain.gain.value = 0.05;
  }
});

audio.addEventListener('error', (e) => {
  stereo.classList.remove('on');
  
  if (power) {
    if (isDirectTuning || isChanging) {
      noiseGain.gain.value = 0;
    } else {
      noiseGain.gain.value = 0.05;
    }
  }
});

let inputDebounceTimer = null;
let lastInputFreq = null;

range.addEventListener('input', () => {
  ctx.resume();
  const currentFreq = +range.value;
  lastInputFreq = currentFreq;
  
  updateNeedle(currentFreq);
  clearTimeout(inputTimer);
  clearTimeout(inputDebounceTimer);
  
  if (!power) {
    noiseGain.gain.value = 0;
    stereo.classList.remove('on');
    return;
  }
  
  const isIOSDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  if (!isChanging && !isDirectTuning) {
    if (isIOSDevice || !isTouching) {
      stationText.textContent = '스캔중...';
      startScan(currentFreq);
    }
  }
  
  if (!isChanging) {
    stereo.classList.remove('on');
  }
  
  inputDebounceTimer = setTimeout(() => {
    if (!isChanging && !isDirectTuning) {
      stopScan();
      isChanging = true;
      snapTo(currentFreq).then(() => {
        setTimeout(() => {
          isChanging = false;
        }, 100);
      }).catch(err => {
        isChanging = false;
      });
    }
  }, 500);
  
  inputTimer = setTimeout(() => {
    if (!isDirectTuning && !isChanging) {
      stopScan();
    }
  }, 550);
});

range.addEventListener('change', () => {
  const currentFreq = +range.value;
  
  if (isChanging) {
    return;
  }
  
  clearTimeout(inputDebounceTimer);
  
  isChanging = true;
  stopScan();
  
  snapTo(currentFreq).then(() => {
    setTimeout(() => {
      isChanging = false;
    }, 100);
  }).catch(err => {
    isChanging = false;
  });
});

powerBtn.onclick = () => {
  ctx.resume();
  power = !power;
  powerBtn.classList.toggle('power-on', power);
  
  if (!power) {
    audio.pause();
    audio.volume = originalVolume;
    stopScan();
    noiseGain.gain.value = 0;
    stereo.classList.remove('on');
    stationText.textContent = '전원 꺼짐';
    nowProgram.textContent = '';
    lastTunedFreq = null;
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = null;
    }
  } else {
    stationText.textContent = '예열중...';
    noiseGain.gain.value = 0.05;
    setTimeout(() => snapTo(+range.value), 800);
  }
};

const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
if (isIOS) {
  range.addEventListener('touchstart', e => {
    isTouching = true;
    lastTouchX = e.touches[0].clientX;
    clearTimeout(inputDebounceTimer);
    
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
  });
  
  range.addEventListener('touchmove', e => {
    e.preventDefault();
    if (lastTouchX === null) return;
    const x = e.touches[0].clientX;
    const dx = x - lastTouchX;
    lastTouchX = x;
    const sensitivity = 0.011;
    let v = parseFloat(range.value);
    v += dx * sensitivity;
    v = Math.max(MIN, Math.min(MAX, v));
    range.value = v.toFixed(1);
    
    const inputEvent = new Event('input', {bubbles: true});
    range.dispatchEvent(inputEvent);
  }, {passive: false});
  
  range.addEventListener('touchend', () => {
  isTouching = false;
  lastTouchX = null;
  
  clearTimeout(inputTimer);
  clearTimeout(inputDebounceTimer);
  
  setTimeout(() => {
    const currentFreq = +range.value;
    
    if (!isChanging && !isDirectTuning) {
      stopScan();
      
      isChanging = true;
      isDirectTuning = true;
      
      snapTo(currentFreq).then(() => {
        setTimeout(() => {
          isChanging = false;
        }, 200);
      }).catch(err => {
        isChanging = false;
        isDirectTuning = false;
      });
    }
  }, 150);
});

}

function closeList() {
  channelList.style.height = channelList.scrollHeight + 'px';
  requestAnimationFrame(() => {
    channelList.style.height = '0px';
    channelList.classList.remove('open');
  });
}

const buttonColors = ['sbs', 'mbc', 'kbs', 'etc'];

channels.forEach((g, index) => {
  const tab = document.createElement('div');
  tab.className = 'tab';
  
  const button = document.createElement('div');
  button.className = `tab-button ${buttonColors[index]}`;
  
  const label = document.createElement('div');
  label.className = 'tab-label';
  label.textContent = g.group;
  
  tab.appendChild(button);
  tab.appendChild(label);
  
  tab.onclick = () => {
    if (activeGroup === g) {
      closeList();
      activeGroup = null;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      return;
    }
    activeGroup = g;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    channelList.innerHTML = '';
    g.list.forEach(ch => {
      const d = document.createElement('div');
      d.className = "channel-item flex justify-between bg-neutral-800 rounded-lg p-3 mb-2 cursor-pointer";
      d.innerHTML = `<span>${ch.name}</span><span class="text-xs text-gray-400">${ch.freq.toFixed(1)}</span>`;
      d.onclick = async () => {
  clearTimeout(inputTimer);
  clearTimeout(inputDebounceTimer);
  
  isDirectTuning = true;
  isChanging = true;
  stopScan();
  
  const isIOSDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isIOSDevice) {
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  
  await snapTo(ch.freq);
  
  closeList();
  activeGroup = null;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  setTimeout(() => {
    isChanging = false;
  }, 200);
};

      channelList.appendChild(d);
    });
    
    channelList.classList.add('open');
    channelList.style.height = '0px';
    
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        channelList.style.height = channelList.scrollHeight + 'px';
      });
    });
  };
  tabs.appendChild(tab);
});

function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('currentTime').textContent = h + ':' + m + ':' + s;
}
updateTime();
setInterval(updateTime, 1000);

document.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, {passive: false});

document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, {passive: false});

document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, {passive: false});

let isMouseDown = false;

range.addEventListener('mousedown', () => {
  isMouseDown = true;
  clearTimeout(inputDebounceTimer);
});

range.addEventListener('mouseup', () => {
  isMouseDown = false;
  
  setTimeout(() => {
    const currentFreq = +range.value;
    
    if (!isChanging && !isDirectTuning) {
      clearTimeout(inputDebounceTimer);
      stopScan();
      
      isChanging = true;
      snapTo(currentFreq).then(() => {
        setTimeout(() => {
          isChanging = false;
        }, 100);
      }).catch(err => {
        isChanging = false;
      });
    }
  }, 50);
});

range.value = 91.9;
updateNeedle(91.9);
stationText.textContent = '전원 꺼짐';
</script>
