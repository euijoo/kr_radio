<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Radio</title>

<style>
:root{
  --bg:#1d1f21;
  --panel:#2c2e30;
  --text:#fff;
  --sub:#aaa;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}
header{
  text-align:center;
  padding:16px;
  font-size:20px;
  border-bottom:1px solid #333;
}

/* ===== TUNER ===== */
.tuner{padding:16px;border-bottom:1px solid #333}
.dial{
  position:relative;
  height:96px;
  background:linear-gradient(#e5b06a,#f2c27e);
  border-radius:12px;
  overflow:hidden;
}
.scale{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:0 10px;
}
.tick{width:6px}

/* small ticks */
.tick.small::before{
  content:"";
  display:block;
  width:1px;
  background:rgba(0,0,0,.4);
  margin:0 auto;
}
.tick.small.s1::before,
.tick.small.s4::before{height:18px}
.tick.small.s2::before,
.tick.small.s3::before{height:12px}

/* mid tick */
.tick.mid::before{
  content:"";
  display:block;
  width:1px;
  height:26px;
  background:rgba(0,0,0,.6);
  margin:0 auto;
}

/* big tick */
.tick.big::before{
  content:"";
  display:block;
  width:2px;
  height:40px;
  background:rgba(0,0,0,.85);
  margin:0 auto;
}
.tick.big span{
  display:block;
  font-size:10px;
  color:rgba(0,0,0,.7);
  margin-top:4px;
}

/* needle */
.needle{
  position:absolute;
  top:-10px;
  width:2px;
  height:120px;
  background:linear-gradient(#ff3b30,#a80000);
  box-shadow:0 0 6px rgba(255,0,0,.6);
  z-index:5;
}
.needle-knob{
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:14px;
  background:#ff3b30;
  border-radius:50%;
  box-shadow:0 0 6px rgba(255,0,0,.7);
}

/* invisible range */
#freqRange{
  position:absolute;
  inset:0;
  opacity:0.01;
  z-index:10;
  touch-action:pan-x;
}

/* freq display */
.freq-wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}
.freq{font-size:34px}
.station{
  text-align:center;
  font-size:14px;
  color:var(--sub);
  height:18px;
}

/* power button */
#powerBtn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#1e88ff;
  border:none;
  box-shadow:0 0 8px rgba(30,136,255,.6);
}
#powerBtn.off{
  opacity:.4;
}

/* ===== LIST ===== */
section{padding:12px 16px}
h2{
  font-size:13px;
  color:var(--sub);
  margin:18px 0 8px;
}
.channel{
  background:var(--panel);
  padding:14px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.channel.active{background:#ff7a18;color:#000}
.channel.paused{opacity:.6}
.ch-freq{
  font-size:11px;
  color:rgba(255,255,255,.6);
}
</style>
</head>

<body>
<header>FM Radio</header>

<div class="tuner">
  <div class="dial" id="dial">
    <div class="scale" id="scale"></div>
    <div class="needle" id="needle">
      <div class="needle-knob"></div>
    </div>
    <input type="range" id="freqRange" min="87.5" max="108.0" step="0.1" value="97.3">
  </div>

  <div class="freq-wrap">
    <div class="freq" id="freqText">97.3 MHz</div>
    <button id="powerBtn"></button>
  </div>
  <div class="station" id="stationText">없음</div>
</div>

<section id="radio-list"></section>

<script>
/* ===== CONSTANT ===== */
const MIN=87.5, MAX=108.0, SNAP=0.15;

/* ===== AUDIO ===== */
const audio=new Audio();
audio.crossOrigin="anonymous";

/* ===== NOISE ===== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const ctx=new AudioCtx();
const noiseGain=ctx.createGain();
noiseGain.gain.value=0;

const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

const noise=ctx.createBufferSource();
noise.buffer=buffer;
noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

/* ===== CHANNEL DATA ===== */
const channels=[
{group:'SBS',list:[
 {name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm'},
 {name:'SBS 러브FM',freq:103.5,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm'},
 {name:'SBS 고릴라디오M',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb'}
]},
{group:'MBC',list:[
 {name:'MBC 표준FM',freq:95.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm'},
 {name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u'},
 {name:'MBC mini 올댓뮤직',freq:100.7,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=chm'}
]},
{group:'KBS',list:[
 {name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
 {name:'KBS 2라디오',freq:106.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio'},
 {name:'KBS 3라디오',freq:104.9,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio'},
 {name:'KBS 1FM',freq:93.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm'},
 {name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]},
{group:'ETC',list:[
 {name:'EBS FM',freq:104.5,url:'https://radio.bsod.kr/stream/?stn=ebs'},
 {name:'TBS FM',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
 {name:'TBS eFM',freq:101.3,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
 {name:'CBS 표준FM',freq:98.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
 {name:'CBS 음악FM',freq:93.9,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
 {name:'CBS JOY4U',freq:90.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
]}
];

/* ===== SCALE ===== */
const scale=document.getElementById('scale');
for(let f=MIN;f<=MAX+0.001;f+=0.1){
  const t=document.createElement('div');
  t.className='tick';
  if(Math.abs(f-Math.round(f))<0.001){
    t.classList.add('big');
    t.innerHTML=`<span>${Math.round(f)}</span>`;
  }else if(Math.abs((f*10)%5)<0.001){
    t.classList.add('mid');
  }else{
    t.classList.add('small');
    const p=Math.round((f*10)%5);
    t.classList.add(['s1','s2','s3','s4'][p-1]);
  }
  scale.appendChild(t);
}

/* ===== LIST ===== */
const list=document.getElementById('radio-list');
const flat=[];
channels.forEach(g=>{
  const h=document.createElement('h2');
  h.textContent=g.group;
  list.appendChild(h);
  g.list.forEach(ch=>{
    const item={...ch};
    flat.push(item);
    const d=document.createElement('div');
    d.className='channel';
    d.innerHTML=`<span>${ch.name}</span><span class="ch-freq">${ch.freq.toFixed(1)}</span>`;
    d.onclick=()=>select(item,d);
    list.appendChild(d);
    item.el=d;
  });
});

/* ===== STATE ===== */
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
const powerBtn=document.getElementById('powerBtn');

let current=null,isPlaying=false,power=true;

/* ===== FUNCTIONS ===== */
function setNoise(v){
  noiseGain.gain.linearRampToValueAtTime(v,ctx.currentTime+0.2);
}
function updateNeedle(freq){
  const w=document.getElementById('dial').clientWidth;
  needle.style.left=((freq-MIN)/(MAX-MIN)*w)+'px';
  freqText.textContent=freq.toFixed(1)+' MHz';
}
function tune(freq,force=false){
  if(!power) return;
  const nearest=flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
  stationText.textContent=nearest.name;

  if(Math.abs(nearest.freq-freq)<=SNAP){
    setNoise(0);
    if(current!==nearest){
      current?.el?.classList.remove('active','paused');
      current=nearest;
      audio.src=nearest.url;
    }
    if(!isPlaying||force){
      audio.play();
      isPlaying=true;
    }
    nearest.el.classList.add('active');
  }else{
    setNoise(0.12);
    audio.pause();
    isPlaying=false;
  }
}
function select(ch,el){
  range.value=ch.freq;
  updateNeedle(ch.freq);
  tune(ch.freq,true);
}

/* ===== EVENTS ===== */
range.addEventListener('input',()=>{
  ctx.resume();
  updateNeedle(+range.value);
  tune(+range.value);
});

/* ===== POWER ===== */
powerBtn.onclick=()=>{
  power=!power;
  powerBtn.classList.toggle('off',!power);
  if(!power){
    audio.pause();
    isPlaying=false;
    setNoise(0);
    stationText.textContent='전원 꺼짐';
  }else{
    stationText.textContent='예열중...';
    setNoise(0.25);
    setTimeout(()=>{
      tune(+range.value,true);
    },900);
  }
};

updateNeedle(+range.value);
</script>
</body>
</html>
