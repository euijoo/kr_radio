<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Radio Dial</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f7;
  color: #111;
}

header {
  padding: 14px;
  text-align: center;
  font-weight: 600;
  font-size: 18px;
}

#dial {
  position: relative;
  height: 140px;
  margin: 20px;
  border-radius: 16px;
  background: #fff;
  overflow: hidden;
}

.scale {
  position: absolute;
  bottom: 20px;
  width: 100%;
  height: 40px;
  display: flex;
}

.scale div {
  flex: 1;
  border-left: 1px solid #ddd;
  font-size: 10px;
  text-align: center;
  color: #999;
}

#needle {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 3px;
  height: 100%;
  background: red;
  transform: translateX(-50%);
  pointer-events: none;
}

#freq {
  text-align: center;
  font-size: 20px;
  margin-bottom: 10px;
}

#program {
  text-align: center;
  font-size: 14px;
  color: #555;
  min-height: 20px;
}

.group {
  margin: 10px;
  background: #fff;
  border-radius: 12px;
}

.group h3 {
  margin: 0;
  padding: 14px;
  border-bottom: 1px solid #eee;
}

.channel {
  padding: 12px 14px;
  border-bottom: 1px solid #f0f0f0;
}

.channel:last-child {
  border-bottom: none;
}

.channel.active {
  background: #eef3ff;
}
</style>
</head>

<body>

<header>FM Radio</header>

<div id="dial">
  <div class="scale" id="scale"></div>
  <div id="needle"></div>
</div>

<div id="freq">97.3 MHz</div>
<div id="program"></div>

<div id="stations"></div>

<audio id="audio"></audio>
<audio id="noise" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQgAAAAA"></audio>

<script>
const FM_MIN = 87.5;
const FM_MAX = 108.0;
let freq = 97.3;
let dragging = false;

const stations = [
  { group: "KBS", list: [
    { name: "KBS 1Radio", freq: 97.3, stream: "https://1radio.gscdn.kbs.co.kr/1radio_192_4.m3u8", json: "json/kbs-1radio.json" },
    { name: "KBS 3Radio", freq: 104.9, stream: "https://3radio.gscdn.kbs.co.kr/3radio_192_4.m3u8", json: "json/kbs-3radio.json" },
    { name: "KBS Classic FM", freq: 93.1, stream: "https://classicfm.gscdn.kbs.co.kr/classicfm_192_4.m3u8", json: "json/kbs-classicfm.json" },
    { name: "KBS Cool FM", freq: 89.1, stream: "https://coolfm.gscdn.kbs.co.kr/coolfm_192_4.m3u8", json: "json/kbs-coolfm.json" },
    { name: "KBS Happy FM", freq: 106.1, stream: "https://happyfm.gscdn.kbs.co.kr/happyfm_192_4.m3u8", json: "json/kbs-happyfm.json" }
  ]},
  { group: "MBC", list: [
    { name: "MBC Standard FM", freq: 95.9, stream: "https://sminiplay.imbc.com/aac/StandardFM", json: "json/mbc-standardfm.json" },
    { name: "MBC FM4U", freq: 91.9, stream: "https://sminiplay.imbc.com/aac/FM4U", json: "json/mbc-fm4u.json" },
    { name: "MBC All That Music", freq: 99.9, stream: "https://sminiplay.imbc.com/aac/AllThatMusic", json: "json/mbc-allthatmusic.json" }
  ]},
  { group: "SBS", list: [
    { name: "SBS PowerFM", freq: 107.7, stream: "https://radio.bsod.kr/stream/?stn=sbs&ch=power", json: "json/sbs-powerfm.json" },
    { name: "SBS LoveFM", freq: 103.5, stream: "https://radio.bsod.kr/stream/?stn=sbs&ch=love", json: "json/sbs-lovefm.json" },
    { name: "SBS Gorilla", freq: 101.3, stream: "https://radio.bsod.kr/stream/?stn=sbs&ch=gorilla", json: "json/sbs-gorillam.json" }
  ]}
];

const audio = document.getElementById("audio");
const noise = document.getElementById("noise");

function renderScale() {
  const scale = document.getElementById("scale");
  for (let i = FM_MIN; i <= FM_MAX; i += 2) {
    const d = document.createElement("div");
    d.textContent = i;
    scale.appendChild(d);
  }
}

function setFreq(f) {
  freq = Math.max(FM_MIN, Math.min(FM_MAX, f));
  document.getElementById("freq").textContent = freq.toFixed(1) + " MHz";
  const hit = findStation();
  if (hit) {
    noise.pause();
    audio.src = hit.stream;
    audio.play();
    loadProgram(hit.json);
  } else {
    audio.pause();
    noise.play();
    document.getElementById("program").textContent = "";
  }
}

function findStation() {
  for (const g of stations) {
    for (const s of g.list) {
      if (Math.abs(s.freq - freq) < 0.15) return s;
    }
  }
  return null;
}

function loadProgram(json) {
  fetch(json)
    .then(r => r.json())
    .then(data => {
      const now = new Date();
      const hhmm = now.toTimeString().slice(0,5);
      const p = data.schedule.weekday.reverse().find(p => p.start <= hhmm);
      document.getElementById("program").textContent = p ? p.title : "";
    });
}

function renderStations() {
  const root = document.getElementById("stations");
  stations.forEach(g => {
    const box = document.createElement("div");
    box.className = "group";
    const h = document.createElement("h3");
    h.textContent = g.group;
    box.appendChild(h);

    g.list.forEach(s => {
      const c = document.createElement("div");
      c.className = "channel";
      c.textContent = `${s.name} · ${s.freq}`;
      c.onclick = () => setFreq(s.freq);
      box.appendChild(c);
    });
    root.appendChild(box);
  });
}

let lastX = null;
document.getElementById("dial").addEventListener("touchstart", e => {
  dragging = true;
  lastX = e.touches[0].clientX;
});
document.getElementById("dial").addEventListener("touchmove", e => {
  if (!dragging) return;
  const dx = e.touches[0].clientX - lastX;
  setFreq(freq + dx * 0.01);
  lastX = e.touches[0].clientX;
});
document.addEventListener("touchend", () => dragging = false);

renderScale();
renderStations();
setFreq(freq);
</script>

</body>
</html>
