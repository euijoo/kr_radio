<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Radio</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
#dial{height:220px}
.scale{position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 12px}
.tick{width:6px;height:100%;position:relative}
.tick::before{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.tick.small::before{width:1px;height:35%;background:#777}
.tick.mid::before{width:1px;height:55%;background:#bbb}
.tick.big::before{width:2px;height:85%;background:#fff}
.tick.big span{position:absolute;bottom:90%;left:50%;transform:translateX(-50%);font-size:10px;color:#eee}

#needle{position:absolute;top:-12px;width:3px;height:244px;background:#facc15;box-shadow:0 0 10px #facc15;z-index:10}

.stereo{width:10px;height:10px;border-radius:50%;background:#0f0;box-shadow:0 0 8px #0f0;opacity:0}
.stereo.on{opacity:1}

#channelList{overflow:hidden;height:0;transition:.4s}
#channelList.open{padding-top:12px}
.channel{padding:10px;background:#222;border-radius:8px;margin-bottom:6px;cursor:pointer}
.tab{cursor:pointer;color:#aaa}
.tab.active{color:#fff;border-bottom:2px solid #facc15}
</style>
</head>

<body class="bg-neutral-900 text-white max-w-md mx-auto">

<header class="flex justify-between p-4">
  <span class="font-semibold">FM Radio</span>
  <button id="powerBtn" class="w-8 h-8 rounded-full bg-neutral-700"></button>
</header>

<div class="px-4">
  <div id="dial" class="relative bg-neutral-800 rounded-xl overflow-hidden">
    <div id="scale" class="scale"></div>
    <div id="needle"></div>
    <input id="range" type="range" min="87.5" max="108" step="0.1"
      class="absolute inset-0 opacity-0">
  </div>

  <div class="mt-3">
    <div id="freqText" class="text-3xl"></div>
    <div id="programText" class="text-sm text-gray-400"></div>
  </div>

  <div class="flex justify-end mt-2">
    <div id="stereo" class="stereo"></div>
  </div>
</div>

<div id="tabs" class="flex justify-around mt-6"></div>
<div id="channelList" class="px-4"></div>

<script>
const MIN=87.5, MAX=108;
const dial=document.getElementById('dial');
const scale=document.getElementById('scale');
const needle=document.getElementById('needle');
const range=document.getElementById('range');
const freqText=document.getElementById('freqText');
const programText=document.getElementById('programText');
const stereo=document.getElementById('stereo');
const powerBtn=document.getElementById('powerBtn');
const tabs=document.getElementById('tabs');
const channelList=document.getElementById('channelList');

const audio=new Audio();

let power=false, activeGroup=null;

/* 눈금 생성 */
for(let f=MIN; f<=MAX; f+=0.1){
  const t=document.createElement('div');
  const d=Math.round((f*10)%10);
  t.className='tick '+(d===0?'big':d===5?'mid':'small');
  if(d===0) t.innerHTML=`<span>${Math.round(f)}</span>`;
  scale.appendChild(t);
}

/* 방송국 */
const channels=[
{group:'KBS',list:[
{name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio',json:'schedules/kbs-1radio.json'},
{name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm',json:'schedules/kbs-coolfm.json'}
]},
{group:'MBC',list:[
{name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u',json:'schedules/mbc-fm4u.json'}
]},
{group:'SBS',list:[
{name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm',json:'schedules/sbs-powerfm.json'}
]}
];

/* 현재 방송 제목 */
async function loadProgram(ch){
  try{
    const res=await fetch(ch.json);
    const data=await res.json();
    const now=new Date();
    const m=now.getHours()*60+now.getMinutes();
    let cur=data.schedule.weekday[0];
    data.schedule.weekday.forEach(p=>{
      const [h,mi]=p.start.split(':').map(Number);
      if(m>=h*60+mi) cur=p;
    });
    programText.textContent=cur.title;
  }catch{
    programText.textContent=ch.name;
  }
}

/* 바늘 */
function updateNeedle(f){
  needle.style.left=((f-MIN)/(MAX-MIN)*dial.clientWidth)+'px';
  freqText.textContent=f.toFixed(1)+' MHz';
}

/* 스냅 */
function tune(f){
  const all=channels.flatMap(g=>g.list);
  const ch=all.reduce((a,b)=>Math.abs(b.freq-f)<Math.abs(a.freq-f)?b:a);
  range.value=ch.freq;
  updateNeedle(ch.freq);
  if(!power) return;
  audio.src=ch.url;
  audio.play();
  stereo.classList.add('on');
  loadProgram(ch);
}

/* 탭 */
channels.forEach(g=>{
  const t=document.createElement('div');
  t.textContent=g.group;
  t.className='tab';
  t.onclick=()=>{
    if(activeGroup===g){
      channelList.style.height=0;
      activeGroup=null;
      t.classList.remove('active');
      return;
    }
    activeGroup=g;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    channelList.innerHTML='';
    g.list.forEach(ch=>{
      const d=document.createElement('div');
      d.className='channel';
      d.textContent=`${ch.name} ${ch.freq}`;
      d.onclick=()=>{tune(ch.freq);channelList.style.height=0;};
      channelList.appendChild(d);
    });
    channelList.style.height=channelList.scrollHeight+'px';
  };
  tabs.appendChild(t);
});

/* 이벤트 */
range.oninput=()=>updateNeedle(+range.value);
range.onchange=()=>tune(+range.value);

powerBtn.onclick=()=>{
  power=!power;
  powerBtn.style.background=power?'#facc15':'#444';
  if(!power){audio.pause();programText.textContent='전원 꺼짐';stereo.classList.remove('on')}
};

range.value=91.9;
updateNeedle(91.9);
programText.textContent='전원 꺼짐';
</script>
</body>
</html>
