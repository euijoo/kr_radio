<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Radio</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ===== TUNER SCALE ===== */
.scale{position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 12px}
.tick{width:6px}
.tick.small::before{content:"";display:block;width:1px;margin:0 auto;background:rgba(0,0,0,.35)}
.tick.small.s1::before,.tick.small.s4::before{height:18px}
.tick.small.s2::before,.tick.small.s3::before{height:12px}
.tick.mid::before{content:"";display:block;width:1px;height:26px;background:rgba(0,0,0,.55);margin:0 auto}
.tick.big::before{content:"";display:block;width:2px;height:40px;background:rgba(0,0,0,.8);margin:0 auto}
.tick.big span{font-size:10px;color:rgba(0,0,0,.6)}

#needle{position:absolute;top:-12px;width:2px;height:140px;
background:linear-gradient(#ff3b30,#a80000);box-shadow:0 0 6px rgba(255,0,0,.6);z-index:10}
#needle::after{content:"";position:absolute;bottom:-8px;left:50%;
transform:translateX(-50%);width:14px;height:14px;border-radius:50%;
background:#ff3b30;box-shadow:0 0 8px rgba(255,0,0,.7)}

.stereo{width:10px;height:10px;border-radius:50%;background:#0f0;
box-shadow:0 0 10px #0f0;opacity:0;transition:.3s}
.stereo.on{opacity:1}

.power-on{background:#facc15!important;box-shadow:0 0 12px #facc15}

/* ===== BROADCAST TABS ===== */
.tab{
  cursor:pointer;
  font-weight:600;
  color:#aaa;
  padding-bottom:4px;
}
.tab.active{
  color:#fff;
  border-bottom:2px solid #facc15;
}

/* ===== CHANNEL ANIMATION ===== */
.channel-wrap{
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:max-height .35s ease, opacity .25s ease;
}
.channel-wrap.open{
  max-height:600px;
  opacity:1;
}
</style>
</head>

<body class="bg-neutral-900 text-white max-w-md mx-auto">

<header class="flex justify-between items-center px-4 py-3 text-lg font-semibold">
  <span>FM Radio</span>
  <button id="powerBtn" class="w-9 h-9 rounded-full bg-neutral-700"></button>
</header>

<!-- TUNER -->
<div class="px-4">
  <div id="dial" class="relative h-28 rounded-xl overflow-hidden bg-gradient-to-b from-amber-300 to-amber-200">
    <div id="scale" class="scale"></div>
    <div id="needle"></div>
    <input id="freqRange" type="range" min="87.5" max="108" step="0.1"
      class="absolute inset-0 opacity-0 z-20 touch-pan-x">
  </div>

  <div class="flex justify-between items-end mt-3">
    <div>
      <div id="freqText" class="text-4xl font-semibold"></div>
      <div id="stationText" class="text-sm text-gray-400"></div>
    </div>
    <div id="stereoLamp" class="stereo"></div>
  </div>
</div>

<!-- BROADCAST TABS -->
<div id="tabs" class="flex justify-around px-6 mt-6"></div>

<!-- CHANNEL LIST -->
<div id="channelList" class="px-4 py-4 channel-wrap"></div>

<script>
/* ===== CONSTANT ===== */
const MIN=87.5, MAX=108;

/* ===== AUDIO + NOISE ===== */
const audio=new Audio();
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const noiseGain=ctx.createGain(); noiseGain.gain.value=0;

const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

const noise=ctx.createBufferSource();
noise.buffer=buffer; noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

/* ===== CHANNEL DATA ===== */
const channels=[
{group:'SBS',list:[
{name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm'},
{name:'SBS 러브FM',freq:103.5,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm'},
{name:'SBS 고릴라디오M',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb'}
]},
{group:'MBC',list:[
{name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u'},
{name:'MBC 표준FM',freq:95.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm'},
{name:'MBC 올댓뮤직',freq:100.7,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=chm'}
]},
{group:'KBS',list:[
{name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
{name:'KBS 2라디오',freq:106.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio'},
{name:'KBS 3라디오',freq:104.9,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio'},
{name:'KBS 1FM',freq:93.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm'},
{name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]},
{group:'ETC',list:[
{name:'EBS FM',freq:104.5,url:'https://radio.bsod.kr/stream/?stn=ebs'},
{name:'TBS FM',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
{name:'TBS eFM',freq:101.3,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
{name:'CBS 표준FM',freq:98.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
{name:'CBS 음악FM',freq:93.9,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
{name:'CBS JOY4U',freq:90.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
]}
];

/* ===== SCALE ===== */
const scale=document.getElementById('scale');
for(let f=MIN;f<=MAX+0.001;f+=0.1){
  const t=document.createElement('div'); t.className='tick';
  if(Math.abs(f-Math.round(f))<0.001){t.classList.add('big');t.innerHTML=`<span>${Math.round(f)}</span>`;}
  else if(Math.abs((f*10)%5)<0.001)t.classList.add('mid');
  else{t.classList.add('small');t.classList.add(['s1','s2','s3','s4'][Math.round((f*10)%5)-1]);}
  scale.appendChild(t);
}

/* ===== STATE ===== */
let power=false,current=null,activeGroup=null;
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
const stereo=document.getElementById('stereoLamp');
const powerBtn=document.getElementById('powerBtn');
const tabs=document.getElementById('tabs');
const channelList=document.getElementById('channelList');

/* ===== CORE ===== */
function updateNeedle(f){
  needle.style.left=((f-MIN)/(MAX-MIN)*dial.clientWidth)+'px';
  freqText.textContent=f.toFixed(1)+' MHz';
}
function snapTo(freq){
  const flat=channels.flatMap(g=>g.list);
  const nearest=flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
  range.value=nearest.freq;
  updateNeedle(nearest.freq);
  if(!power) return;
  noiseGain.gain.value=0;
  stereo.classList.add('on');
  current=nearest;
  audio.src=current.url;
  audio.play();
  stationText.textContent=current.name;
}

/* ===== TABS WITH TOGGLE ===== */
channels.forEach(g=>{
  const tab=document.createElement('div');
  tab.className='tab';
  tab.textContent=g.group;

  tab.onclick=()=>{
    // 같은 탭 다시 클릭 → 닫기
    if(activeGroup === g){
      channelList.classList.remove('open');
      tab.classList.remove('active');
      activeGroup=null;
      return;
    }

    // 다른 탭 클릭
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');

    channelList.innerHTML='';
    activeGroup=g;

    g.list.forEach(ch=>{
      const d=document.createElement('div');
      d.className="flex justify-between bg-neutral-800 rounded-lg p-3 mb-2 cursor-pointer";
      d.innerHTML=`<span>${ch.name}</span><span class="text-xs text-gray-400">${ch.freq.toFixed(1)}</span>`;
      d.onclick=()=>{
        snapTo(ch.freq);
        channelList.classList.remove('open');
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        activeGroup=null;
      };
      channelList.appendChild(d);
    });

    requestAnimationFrame(()=>channelList.classList.add('open'));
  };

  tabs.appendChild(tab);
});

/* ===== EVENTS ===== */
range.addEventListener('input',()=>{
  ctx.resume();
  updateNeedle(+range.value);
  noiseGain.gain.value=0.15;
  stereo.classList.remove('on');
  stationText.textContent='스캔중...';
});
range.addEventListener('change',()=>snapTo(+range.value));

powerBtn.onclick=()=>{
  power=!power;
  powerBtn.classList.toggle('power-on',power);
  if(!power){
    audio.pause();
    noiseGain.gain.value=0;
    stereo.classList.remove('on');
    stationText.textContent='전원 꺼짐';
  }else{
    stationText.textContent='예열중...';
    noiseGain.gain.value=0.25;
    setTimeout(()=>snapTo(+range.value),800);
  }
};

/* INIT */
range.value=91.9;
updateNeedle(91.9);
stationText.textContent='전원 꺼짐';
</script>
</body>
</html>
