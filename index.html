<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>EJF Radio</title>
  <meta name="theme-color" content="#171717" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/ejf-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-neutral-900 text-white max-w-md mx-auto">
  <div class="app-shell min-h-screen flex flex-col">
    <header class="app-header flex items-center justify-between px-4 py-3">
      <div class="brand">
        <h1 class="text-lg font-semibold leading-tight">FM Radio</h1>
        <p id="currentTime" class="text-xs font-normal text-gray-400 mt-0.5"></p>
      </div>

      <button
        id="powerBtn"
        type="button"
        class="w-9 h-9 rounded-full bg-neutral-700"
        aria-label="라디오 전원"
      ></button>
    </header>

    <main class="app-main flex-1">
      <section class="radio-panel px-4" aria-label="라디오 튜너">
        <div id="dial" class="relative rounded-xl overflow-hidden bg-neutral-900">
          <div id="scale" class="scale" aria-hidden="true"></div>
          <div id="needle" aria-hidden="true"></div>

          <input
            id="freqRange"
            type="range"
            min="87.5"
            max="108"
            step="0.1"
            class="absolute inset-0 opacity-0 z-20"
            aria-label="주파수 조절"
          />
        </div>

        <div id="dialInfo" class="pt-3">
          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0 flex-1">
              <div id="freqText" class="leading-tight"></div>
              <div id="stationText" class="mt-1 text-[13px] text-gray-300 leading-tight"></div>
              <div id="nowProgram" class="mt-0.5 text-[12px] text-gray-400 leading-tight"></div>
            </div>

            <div class="flex flex-col items-end gap-2 shrink-0">
              <div class="flex items-center gap-2" aria-label="스테레오 상태">
                <div id="stereoLamp" class="stereo" aria-hidden="true"></div>
              </div>

              <button
                id="muteBtn"
                type="button"
                class="w-2 h-2 rounded-full bg-yellow-400/40"
                aria-label="음소거"
              ></button>
            </div>
          </div>
        </div>
      </section>

      <section class="channel-section" aria-label="방송사 선택">
        <div id="tabs" class="flex justify-around px-6 mt-6"></div>
        <div id="channelList" class="px-4 py-4"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
