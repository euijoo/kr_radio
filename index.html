<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Radio</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ================== TUNER SIZE ================== */
#dial{
  --dial-height: 220px;
  height: var(--dial-height);
}

/* ================== SCALE ================== */
.scale{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:0 12px;
}
.tick{
  width:6px;
  height:100%;
  position:relative;
}
.tick::before{
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
}

.tick.small::before{
  width:1px;
  height:35%;
  background:#e5e5e5;
  opacity:.6;
}
.tick.mid::before{
  width:1px;
  height:55%;
  background:#f0f0f0;
  opacity:.8;
}
.tick.big::before{
  width:2px;
  height:85%;
  background:#ffffff;
  opacity:.95;
}
.tick.big span{
  position:absolute;
  bottom:calc(85% + 6px);
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  color:#e0e0e0;
}

/* ================== NEEDLE ================== */
#needle{
  position:absolute;
  top:-12px;
  width:3px;
  height:calc(var(--dial-height) + 24px);
  background:linear-gradient(#ffd700,#ffae00);
  box-shadow:0 0 12px rgba(255,215,0,.9);
  z-index:10;
}

/* ================== INFO (튜너 아래) ================== */
#dialInfo{
  padding:10px 12px 0;
}
#freqText{
  font-size:32px;
  font-weight:600;
  line-height:1;
}
#stationText{
  font-size:13px;
  color:#9ca3af;
  margin-top:4px;
}

/* ================== UI ================== */
.stereo{
  width:10px;height:10px;border-radius:50%;
  background:#0f0;box-shadow:0 0 10px #0f0;
  opacity:0;transition:.3s
}
.stereo.on{opacity:1}

.power-on{background:#facc15!important;box-shadow:0 0 12px #facc15}

.tab{cursor:pointer;font-weight:600;color:#aaa;padding-bottom:4px}
.tab.active{color:#fff;border-bottom:2px solid #facc15}

/* ================== CHANNEL LIST ================== */
#channelList{
  overflow:hidden;
  height:0;
  opacity:0;
  transform:translateY(-6px);
  transition:
    height .45s cubic-bezier(.4,0,.2,1),
    opacity .3s ease,
    transform .45s cubic-bezier(.4,0,.2,1);
}
#channelList.open{opacity:1;transform:translateY(0)}
.channel-item{
  opacity:0;
  transform:translateY(6px);
  transition:all .35s ease
}
#channelList.open .channel-item{
  opacity:1;
  transform:translateY(0)
}
</style>
</head>

<body class="bg-neutral-900 text-white max-w-md mx-auto">

<header class="flex justify-between items-center px-4 py-3 text-lg font-semibold">
  <span>FM Radio</span>
  <button id="powerBtn" class="w-9 h-9 rounded-full bg-neutral-700"></button>
</header>

<div class="px-4">
  <!-- 튜너 프레임 -->
  <div id="dial" class="relative rounded-xl overflow-hidden bg-gradient-to-b from-neutral-800 to-neutral-900">
    <div id="scale" class="scale"></div>
    <div id="needle"></div>
    <input id="freqRange" type="range" min="87.5" max="108" step="0.1"
      class="absolute inset-0 opacity-0 z-20 touch-pan-x">
  </div>

  <!-- 🔥 튜너 프레임 바로 아래 -->
  <div id="dialInfo">
    <div id="freqText"></div>
    <div id="stationText"></div>
  </div>

  <div class="flex justify-end mt-3">
    <div id="stereoLamp" class="stereo"></div>
  </div>
</div>

<div id="tabs" class="flex justify-around px-6 mt-6"></div>
<div id="channelList" class="px-4 py-4"></div>

<script>
const MIN=87.5, MAX=108;
const audio=new Audio();
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const noiseGain=ctx.createGain(); noiseGain.gain.value=0;

const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.5;

const noise=ctx.createBufferSource();
noise.buffer=buffer; noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

const channels=[
{group:'SBS',list:[
{name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm'},
{name:'SBS 러브FM',freq:103.5,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm'},
{name:'SBS 고릴라디오M',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb'}
]},
{group:'MBC',list:[
{name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u'},
{name:'MBC 표준FM',freq:95.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm'},
{name:'MBC 올댓뮤직',freq:100.7,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=chm'}
]},
{group:'KBS',list:[
{name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
{name:'KBS 2라디오',freq:106.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio'},
{name:'KBS 3라디오',freq:104.9,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio'},
{name:'KBS 1FM',freq:93.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm'},
{name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]},
{group:'ETC',list:[
{name:'EBS FM',freq:104.5,url:'https://radio.bsod.kr/stream/?stn=ebs'},
{name:'TBS FM',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
{name:'TBS eFM',freq:101.3,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
{name:'CBS 표준FM',freq:98.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
{name:'CBS 음악FM',freq:93.9,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
{name:'CBS JOY4U',freq:90.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
]}
];

const scale=document.getElementById('scale');
for(let f=MIN; f<=MAX+0.001; f+=0.1){
  const t=document.createElement('div');
  t.className='tick';
  const step=Math.round((f*10)%10);
  if(step===0){
    t.classList.add('big');
    t.innerHTML=`<span>${Math.round(f)}</span>`;
  }else if(step===5){
    t.classList.add('mid');
  }else{
    t.classList.add('small');
  }
  scale.appendChild(t);
}

let power=false,activeGroup=null;
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
const stereo=document.getElementById('stereoLamp');
const powerBtn=document.getElementById('powerBtn');
const tabs=document.getElementById('tabs');
const channelList=document.getElementById('channelList');

function updateNeedle(f){
  needle.style.left=((f-MIN)/(MAX-MIN)*dial.clientWidth)+'px';
  freqText.textContent=f.toFixed(1)+' MHz';
}

function snapTo(freq){
  const flat=channels.flatMap(g=>g.list);
  const nearest=flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
  range.value=nearest.freq;
  updateNeedle(nearest.freq);
  if(!power) return;
  noiseGain.gain.value=0;
  stereo.classList.add('on');
  audio.src=nearest.url;
  audio.volume=0;
  audio.play();
  let v=0;
  const fade=setInterval(()=>{
    v+=0.05;
    audio.volume=Math.min(v,1);
    if(v>=1) clearInterval(fade);
  },40);
  stationText.textContent=nearest.name;
}

function openList(){
  channelList.classList.add('open');
  channelList.style.height=channelList.scrollHeight+'px';
}
function closeList(){
  channelList.style.height=channelList.scrollHeight+'px';
  requestAnimationFrame(()=>{
    channelList.style.height='0px';
    channelList.classList.remove('open');
  });
}

channels.forEach(g=>{
  const tab=document.createElement('div');
  tab.className='tab';
  tab.textContent=g.group;
  tab.onclick=()=>{
    if(activeGroup===g){
      closeList(); activeGroup=null;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      return;
    }
    activeGroup=g;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    channelList.innerHTML='';
    g.list.forEach(ch=>{
      const d=document.createElement('div');
      d.className="channel-item flex justify-between bg-neutral-800 rounded-lg p-3 mb-2 cursor-pointer";
      d.innerHTML=`<span>${ch.name}</span><span class="text-xs text-gray-400">${ch.freq.toFixed(1)}</span>`;
      d.onclick=()=>{
        snapTo(ch.freq);
        closeList();
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        activeGroup=null;
      };
      channelList.appendChild(d);
    });
    openList();
  };
  tabs.appendChild(tab);
});

range.addEventListener('input',()=>{
  ctx.resume();
  updateNeedle(+range.value);
  if(!power){
    noiseGain.gain.value=0;
    stereo.classList.remove('on');
    stationText.textContent='';
    return;
  }
  noiseGain.gain.value=0.05;
  stereo.classList.remove('on');
  stationText.textContent='스캔중...';
});
range.addEventListener('change',()=>snapTo(+range.value));

powerBtn.onclick=()=>{
  power=!power;
  powerBtn.classList.toggle('power-on',power);
  if(!power){
    audio.pause();
    noiseGain.gain.value=0;
    stereo.classList.remove('on');
    stationText.textContent='전원 꺼짐';
  }else{
    stationText.textContent='예열중...';
    noiseGain.gain.value=0.05;
    setTimeout(()=>snapTo(+range.value),800);
  }
};

range.value=91.9;
updateNeedle(91.9);
stationText.textContent='전원 꺼짐';
</script>
</body>
</html>
