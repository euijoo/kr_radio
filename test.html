<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FM Radio</title>

<style>
:root{
  --bg:#1d1f21;
  --panel:#2c2e30;
  --accent:#ff7a18;
  --text:#fff;
  --sub:#aaa;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}
header{
  text-align:center;
  padding:16px;
  font-size:20px;
  border-bottom:1px solid #333;
}

/* ===== TUNER ===== */
.tuner{padding:16px;border-bottom:1px solid #333}
.dial{
  position:relative;
  height:96px;
  background:linear-gradient(#e5b06a,#f2c27e);
  border-radius:12px;
  overflow:hidden;
}

/* scale */
.scale{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:0 10px;
}
.tick{width:6px}
.tick.small::before{
  content:"";
  display:block;
  height:16px;width:1px;
  background:rgba(0,0,0,.4);
  margin:0 auto;
}
.tick.mid::before{
  content:"";
  display:block;
  height:26px;width:1px;
  background:rgba(0,0,0,.6);
  margin:0 auto;
}
.tick.big::before{
  content:"";
  display:block;
  height:40px;width:2px;
  background:rgba(0,0,0,.8);
  margin:0 auto;
}
.tick.big span{
  display:block;
  font-size:10px;
  color:rgba(0,0,0,.7);
  margin-top:4px;
}

/* needle */
.needle{
  position:absolute;
  top:-10px;
  width:2px;
  height:120px;
  background:linear-gradient(#ff3b30,#a80000);
  box-shadow:0 0 6px rgba(255,0,0,.6);
  z-index:5;
}

/* IMPORTANT: iOS-compatible range */
#freqRange{
  position:absolute;
  inset:0;
  z-index:10;
  background:transparent;
  appearance:none;
  -webkit-appearance:none;
}
#freqRange::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:100%;
  height:100%;
  background:transparent;
}

.freq{text-align:center;font-size:34px;margin-top:10px}
.station{text-align:center;font-size:14px;color:var(--sub);height:18px}

/* list */
section{padding:12px 16px}
h2{font-size:13px;color:var(--sub);margin:18px 0 8px}
.channel{
  background:var(--panel);
  padding:14px;
  border-radius:10px;
  margin-bottom:8px;
}
.channel.active{background:var(--accent);color:#000}
.channel.paused{opacity:.6}
</style>
</head>

<body>

<header>FM Radio</header>

<div class="tuner">
  <div class="dial" id="dial">
    <div class="scale" id="scale"></div>
    <div class="needle" id="needle"></div>
    <input type="range" id="freqRange" min="87.5" max="108.0" step="0.1" value="97.3">
  </div>
  <div class="freq" id="freqText">97.3 MHz</div>
  <div class="station" id="stationText">없음</div>
</div>

<section id="radio-list"></section>

<!-- 🔴 반드시 DOM에 존재해야 함 -->
<audio id="player" playsinline></audio>

<script>
const MIN=87.5, MAX=108.0, SNAP=0.15;

const audio=document.getElementById('player');

/* ===== Media Session ===== */
function updateMediaSession(title, artist){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title,
    artist,
    album:'Live Radio',
    artwork:[{
      src:'https://upload.wikimedia.org/wikipedia/commons/4/4f/Radio_icon.svg',
      sizes:'512x512',
      type:'image/png'
    }]
  });
}

/* ===== Noise ===== */
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const noiseGain=ctx.createGain();
noiseGain.gain.value=0;

const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

const noise=ctx.createBufferSource();
noise.buffer=buffer;
noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

/* ===== Channels ===== */
const channels=[
{group:'KBS',list:[
 {name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
 {name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]}
];

const flat=[];
const list=document.getElementById('radio-list');
channels.forEach(g=>{
 const h=document.createElement('h2');
 h.textContent=g.group;
 list.appendChild(h);
 g.list.forEach(ch=>{
  const item={...ch,group:g.group};
  flat.push(item);
  const d=document.createElement('div');
  d.className='channel';
  d.textContent=ch.name;
  d.onclick=()=>selectChannel(item);
  list.appendChild(d);
  item.el=d;
 });
});

/* ===== UI ===== */
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
let current=null,isPlaying=false;

function updateNeedle(freq){
 const w=document.getElementById('dial').clientWidth;
 needle.style.left=((freq-MIN)/(MAX-MIN)*w)+'px';
 freqText.textContent=freq.toFixed(1)+' MHz';
}

function setNoise(v){
 noiseGain.gain.linearRampToValueAtTime(v,ctx.currentTime+0.15);
}

function tune(freq){
 const nearest=flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
 stationText.textContent=nearest.name;

 if(Math.abs(nearest.freq-freq)<=SNAP){
  setNoise(0);
  if(current!==nearest){
   current=nearest;
   audio.src=nearest.url;
   updateMediaSession(nearest.name,nearest.group);
  }
  if(!isPlaying){
   audio.play();
   isPlaying=true;
  }
 }else{
  setNoise(0.08);
  audio.pause();
  isPlaying=false;
 }
}

function selectChannel(ch){
 range.value=ch.freq;
 updateNeedle(ch.freq);
 tune(ch.freq);
}

/* events */
range.addEventListener('input',()=>{
 ctx.resume();
 updateNeedle(+range.value);
 tune(+range.value);
});

updateNeedle(range.value);
</script>

</body>
</html>
