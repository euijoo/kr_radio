<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FM Radio</title>

<style>
:root{
  --bg:#1d1f21;
  --panel:#2c2e30;
  --accent:#ff7a18;
  --text:#fff;
  --sub:#aaa;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}
header{
  text-align:center;
  padding:16px;
  font-size:20px;
  border-bottom:1px solid #333;
}

/* ===== TUNER ===== */
.tuner{padding:16px;border-bottom:1px solid #333}
.dial{
  position:relative;
  height:96px;
  background:linear-gradient(#e5b06a,#f2c27e);
  border-radius:12px;
  overflow:hidden;
}
.scale{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:0 10px;
}
.tick{width:6px}
.tick.small::before{
  content:"";
  display:block;
  height:16px;width:1px;
  background:rgba(0,0,0,.4);
  margin:0 auto;
}
.tick.mid::before{
  content:"";
  display:block;
  height:26px;width:1px;
  background:rgba(0,0,0,.6);
  margin:0 auto;
}
.tick.big::before{
  content:"";
  display:block;
  height:40px;width:2px;
  background:rgba(0,0,0,.8);
  margin:0 auto;
}
.tick.big span{
  display:block;
  font-size:10px;
  color:rgba(0,0,0,.7);
  margin-top:4px;
}

.needle{
  position:absolute;
  top:-10px;
  width:2px;
  height:120px;
  background:linear-gradient(#ff3b30,#a80000);
  box-shadow:0 0 6px rgba(255,0,0,.6);
  z-index:5;
}

#freqRange{
  position:absolute;
  inset:0;
  opacity:0.01;
  z-index:10;
  touch-action:pan-x;
}

.freq{text-align:center;font-size:34px;margin-top:10px}
.station{text-align:center;font-size:14px;color:var(--sub);height:18px}

/* ===== LIST ===== */
section{padding:12px 16px}
h2{font-size:13px;color:var(--sub);margin:18px 0 8px}
.channel{
  background:var(--panel);
  padding:14px;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
}
.channel.active{background:var(--accent);color:#000}
.channel.paused{opacity:.6}
</style>
</head>

<body>

<header>FM Radio</header>

<div class="tuner">
  <div class="dial" id="dial">
    <div class="scale" id="scale"></div>
    <div class="needle" id="needle"></div>
    <input type="range" id="freqRange" min="87.5" max="108.0" step="0.1" value="97.3">
  </div>
  <div class="freq" id="freqText">97.3 MHz</div>
  <div class="station" id="stationText">없음</div>
</div>

<section id="radio-list"></section>

<script>
/* ===== CONSTANT ===== */
const MIN=87.5, MAX=108.0, SNAP=0.15;

/* ===== AUDIO ===== */
const audio=new Audio();
audio.crossOrigin="anonymous";

/* ===== MEDIA SESSION ===== */
function updateMediaSession(title, artist){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title,
    artist,
    album:'Live Radio',
    artwork:[{
      src:'https://raw.githubusercontent.com/euijoo/kr_radio/03d1ba9dcd810ae5d613a287b5698585bb251d1e/img/lockicon.svg',
      sizes:'512x512',
      type:'image/png'
    }]
  });
}

/* ===== NOISE ===== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const ctx=new AudioCtx();
const noiseGain=ctx.createGain();
noiseGain.gain.value=0;

const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

const noise=ctx.createBufferSource();
noise.buffer=buffer;
noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

/* ===== CHANNEL DATA ===== */
const channels=[
{group:'SBS',list:[
 {name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm'},
 {name:'SBS 러브FM',freq:103.5,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm'},
 {name:'SBS 고릴라디오M',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb'}
]},
{group:'MBC',list:[
 {name:'MBC 표준FM',freq:95.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm'},
 {name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u'},
 {name:'MBC mini 올댓뮤직',freq:100.7,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=chm'}
]},
{group:'KBS',list:[
 {name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
 {name:'KBS 2라디오',freq:106.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio'},
 {name:'KBS 3라디오',freq:104.9,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio'},
 {name:'KBS 1FM',freq:93.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm'},
 {name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]},
{group:'ETC',list:[
 {name:'EBS FM',freq:104.5,url:'https://radio.bsod.kr/stream/?stn=ebs'},
 {name:'TBS FM',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
 {name:'TBS eFM',freq:101.3,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
 {name:'CBS 표준FM',freq:98.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
 {name:'CBS 음악FM',freq:93.9,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
 {name:'CBS JOY4U',freq:90.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
]}
];

const scale=document.getElementById('scale');
for(let f=MIN;f<=MAX+0.001;f+=0.1){
 const t=document.createElement('div');
 t.className='tick';
 if(Math.abs(f-Math.round(f))<0.001){
  t.classList.add('big');
  t.innerHTML=`<span>${Math.round(f)}</span>`;
 }else if(Math.abs((f*10)%5)<0.001){
  t.classList.add('mid');
 }else t.classList.add('small');
 scale.appendChild(t);
}

/* ===== LIST ===== */
const list=document.getElementById('radio-list');
const flat=[];
channels.forEach(g=>{
 const h=document.createElement('h2');
 h.textContent=g.group;
 list.appendChild(h);
 g.list.forEach(ch=>{
  const item={...ch,group:g.group};
  flat.push(item);
  const d=document.createElement('div');
  d.className='channel';
  d.textContent=ch.name;
  d.onclick=()=>onListClick(item,d);
  list.appendChild(d);
  item.el=d;
 });
});

/* ===== STATE ===== */
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
let current=null,isPlaying=false;

/* ===== FUNCTIONS ===== */
function setNoise(v){
 noiseGain.gain.linearRampToValueAtTime(v,ctx.currentTime+0.15);
}
function updateNeedle(freq){
 const w=document.getElementById('dial').clientWidth;
 needle.style.left=((freq-MIN)/(MAX-MIN)*w)+'px';
 freqText.textContent=freq.toFixed(1)+' MHz';
}
function tune(freq,force=false){
 const nearest=flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
 stationText.textContent=nearest.name;

 if(Math.abs(nearest.freq-freq)<=SNAP){
  setNoise(0);
  if(current!==nearest){
   if(current?.el) current.el.classList.remove('active','paused');
   current=nearest;
   audio.src=nearest.url;
   updateMediaSession(nearest.name,nearest.group);
  }
  if(!isPlaying||force){
   audio.play();
   isPlaying=true;
  }
  nearest.el.classList.add('active');
 }else{
  setNoise(0.1);
  audio.pause();
  isPlaying=false;
  current?.el?.classList.add('paused');
 }
}
function onListClick(ch,el){
 if(current===ch){
  if(isPlaying){
   audio.pause();isPlaying=false;el.classList.add('paused');
  }else{
   audio.play();isPlaying=true;el.classList.remove('paused');
  }
 }else{
  range.value=ch.freq;
  updateNeedle(ch.freq);
  tune(ch.freq,true);
 }
}

/* ===== EVENTS ===== */
range.addEventListener('input',()=>{
 ctx.resume();
 const f=parseFloat(range.value);
 updateNeedle(f);
 tune(f);
});
range.addEventListener('change',()=>{
 const f=parseFloat(range.value);
 const n=flat.reduce((a,b)=>Math.abs(b.freq-f)<Math.abs(a.freq-f)?b:a);
 range.value=n.freq;
 updateNeedle(n.freq);
 tune(n.freq,true);
});

updateNeedle(range.value);
</script>

</body>
</html>
