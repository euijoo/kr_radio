<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Radio</title>

<style>
:root{
  --bg:#1d1f21; --panel:#2c2e30; --text:#fff; --sub:#aaa;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}
header{
  text-align:center; padding:16px; font-size:20px;
  border-bottom:1px solid #333;
}

/* ===== TUNER ===== */
.tuner{padding:16px;border-bottom:1px solid #333}
.dial{
  position:relative;height:96px;
  background:linear-gradient(#e5b06a,#f2c27e);
  border-radius:12px;
  overflow:hidden;
  transition:filter .3s;
}
.dial.off{filter:brightness(.45) saturate(.4)}

.scale{
  position:absolute; inset:0;
  display:flex; align-items:flex-end;
  padding:0 10px;
  z-index:2;
}
.tick{width:6px}
.tick.small::before{
  content:"";display:block;width:1px;
  background:rgba(0,0,0,.45);margin:0 auto;
}
.tick.small.s1::before,.tick.small.s4::before{height:18px}
.tick.small.s2::before,.tick.small.s3::before{height:12px}
.tick.mid::before{
  content:"";display:block;width:1px;height:26px;
  background:rgba(0,0,0,.65);margin:0 auto;
}
.tick.big::before{
  content:"";display:block;width:2px;height:40px;
  background:rgba(0,0,0,.9);margin:0 auto;
}
.tick.big span{
  display:block;font-size:10px;
  color:rgba(0,0,0,.75);margin-top:4px;
}

/* ===== NEEDLE ===== */
.needle{
  position:absolute;top:-10px;
  width:2px;height:120px;
  background:linear-gradient(#ff3b30,#a80000);
  z-index:4;
}
.needle-knob{
  position:absolute;bottom:-10px;left:50%;
  transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;
  background:#ff3b30;
  box-shadow:0 0 10px rgba(255,0,0,.8);
  cursor:grab;
}

/* range */
#freqRange{
  position:absolute; inset:0;
  opacity:.01; z-index:5;
  touch-action:pan-x;
}

/* ===== DISPLAY ===== */
.freq-wrap{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.freq{font-size:34px}
.station{font-size:14px;color:var(--sub);text-align:left;height:18px}

/* ===== POWER ===== */
#powerBtn{
  width:36px;height:36px;border-radius:50%;
  background:#ffcc00;border:none;
  box-shadow:0 0 10px rgba(255,204,0,.8);
}
#powerBtn.off{opacity:.4}

/* ===== LIST ===== */
section{padding:12px 16px}
h2{font-size:13px;color:var(--sub);margin:18px 0 8px}
.channel{
  background:var(--panel);padding:14px;border-radius:10px;
  margin-bottom:8px;display:flex;
  justify-content:space-between;cursor:pointer
}
.channel.active{background:#ff7a18;color:#000}
.ch-freq{font-size:11px;color:rgba(255,255,255,.6)}
</style>
</head>

<body>
<header>FM Radio</header>

<div class="tuner">
  <div class="dial off" id="dial">
    <div class="scale" id="scale"></div>
    <div class="needle" id="needle">
      <div class="needle-knob"></div>
    </div>
    <input type="range" id="freqRange" min="87.5" max="108" step="0.1" value="97.3">
  </div>

  <div class="freq-wrap">
    <div class="freq" id="freqText">97.3 MHz</div>
    <button id="powerBtn" class="off"></button>
  </div>
  <div class="station" id="stationText">전원 꺼짐</div>
</div>

<section id="radio-list"></section>

<script>
/* ===== STATE ===== */
const MIN=87.5, MAX=108;
let power=false, current=null;
let virtualFreq=97.3, raf=null;

/* ===== AUDIO ===== */
const audio=new Audio(); audio.crossOrigin="anonymous";

/* ===== NOISE ===== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const ctx=new AudioCtx();
const noiseGain=ctx.createGain(); noiseGain.gain.value=0;

const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const data=buf.getChannelData(0);
for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
const noise=ctx.createBufferSource();
noise.buffer=buf; noise.loop=true;
noise.connect(noiseGain).connect(ctx.destination);
noise.start();

/* ===== CHANNEL DATA ===== */
const groups=[
{title:'SBS',list:[
 {name:'SBS 파워FM',freq:107.7,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=powerfm'},
 {name:'SBS 러브FM',freq:103.5,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=lovefm'},
 {name:'SBS 고릴라디오M',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=sbs&ch=dmb'}
]},
{title:'MBC',list:[
 {name:'MBC 표준FM',freq:95.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=sfm'},
 {name:'MBC FM4U',freq:91.9,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=fm4u'},
 {name:'MBC 올댓뮤직',freq:100.7,url:'https://radio.bsod.kr/stream/?stn=mbc&ch=chm'}
]},
{title:'KBS',list:[
 {name:'KBS 1라디오',freq:97.3,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1radio'},
 {name:'KBS 2라디오',freq:106.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2radio'},
 {name:'KBS 3라디오',freq:104.9,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=3radio'},
 {name:'KBS 1FM',freq:93.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=1fm'},
 {name:'KBS 2FM',freq:89.1,url:'https://radio.bsod.kr/stream/?stn=kbs&ch=2fm'}
]},
{title:'ETC',list:[
 {name:'EBS FM',freq:104.5,url:'https://radio.bsod.kr/stream/?stn=ebs'},
 {name:'TBS FM',freq:95.1,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=fm'},
 {name:'TBS eFM',freq:101.3,url:'https://radio.bsod.kr/stream/?stn=tbs&ch=efm'},
 {name:'CBS 표준FM',freq:98.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=sfm'},
 {name:'CBS 음악FM',freq:93.9,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=mfm'},
 {name:'CBS JOY4U',freq:90.1,url:'https://radio.bsod.kr/stream/?stn=cbs&ch=joy4u'}
]}
];

const flat=[];
const list=document.getElementById('radio-list');
groups.forEach(g=>{
  const h=document.createElement('h2');
  h.textContent=g.title;
  list.appendChild(h);
  g.list.forEach(ch=>{
    flat.push(ch);
    const d=document.createElement('div');
    d.className='channel';
    d.innerHTML=`<span>${ch.name}</span><span class="ch-freq">${ch.freq.toFixed(1)}</span>`;
    d.onclick=()=>power && snapTo(ch);
    list.appendChild(d);
    ch.el=d;
  });
});

/* ===== SCALE ===== */
const scale=document.getElementById('scale');
for(let f=MIN;f<=MAX+0.001;f+=0.1){
  const t=document.createElement('div'); t.className='tick';
  if(Math.abs(f-Math.round(f))<0.001){
    t.classList.add('big'); t.innerHTML=`<span>${Math.round(f)}</span>`;
  }else if(Math.abs((f*10)%5)<0.001){
    t.classList.add('mid');
  }else{
    t.classList.add('small');
    t.classList.add(['s1','s2','s3','s4'][Math.round((f*10)%5)-1]);
  }
  scale.appendChild(t);
}

/* ===== UI ===== */
const range=document.getElementById('freqRange');
const needle=document.getElementById('needle');
const dial=document.getElementById('dial');
const freqText=document.getElementById('freqText');
const stationText=document.getElementById('stationText');
const powerBtn=document.getElementById('powerBtn');

function updateUI(freq){
  needle.style.left=((freq-MIN)/(MAX-MIN)*dial.clientWidth)+'px';
  freqText.textContent=freq.toFixed(1)+' MHz';
}

function nearest(freq){
  return flat.reduce((a,b)=>Math.abs(b.freq-freq)<Math.abs(a.freq-freq)?b:a);
}

function lock(ch){
  current?.el?.classList.remove('active');
  current=ch;
  ch.el.classList.add('active');
  stationText.textContent=ch.name;
  audio.src=ch.url;
  audio.play();
  noiseGain.gain.value=0;
}

function snapTo(ch){
  cancelAnimationFrame(raf);
  function step(){
    const diff=ch.freq-virtualFreq;
    if(Math.abs(diff)<0.01){
      virtualFreq=ch.freq;
      range.value=ch.freq.toFixed(1);
      updateUI(ch.freq);
      lock(ch);
      return;
    }
    virtualFreq+=diff*0.25;
    updateUI(virtualFreq);
    raf=requestAnimationFrame(step);
  }
  step();
}

/* ===== EVENTS ===== */
range.oninput=()=>{
  if(!power) return;
  cancelAnimationFrame(raf);
  virtualFreq=parseFloat(range.value);
  updateUI(virtualFreq);
  noiseGain.gain.value=0.15;
};

range.onchange=()=>{
  if(!power) return;
  snapTo(nearest(virtualFreq));
};

powerBtn.onclick=()=>{
  power=!power;
  powerBtn.classList.toggle('off',!power);
  dial.classList.toggle('off',!power);
  audio.pause();
  noiseGain.gain.value=0;
  stationText.textContent=power?'예열중...':'전원 꺼짐';
  if(power){
    ctx.resume();
    setTimeout(()=>range.onchange(),600);
  }
};

updateUI(virtualFreq);
</script>
</body>
</html>
